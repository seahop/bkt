apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bkt.fullname" . }}-backend
  labels:
    {{- include "bkt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.env.JWT_SECRET is required" .Values.backend.env.JWT_SECRET | quote }}
  ENCRYPTION_KEY: {{ required "backend.env.ENCRYPTION_KEY is required" .Values.backend.env.ENCRYPTION_KEY | quote }}
  ADMIN_PASSWORD: {{ required "backend.env.ADMIN_PASSWORD is required" .Values.backend.env.ADMIN_PASSWORD | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}
  {{- else }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if .Values.backend.env.GOOGLE_CLIENT_SECRET }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.env.GOOGLE_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.backend.env.S3_SECRET_ACCESS_KEY }}
  S3_SECRET_ACCESS_KEY: {{ .Values.backend.env.S3_SECRET_ACCESS_KEY | quote }}
  {{- end }}
  {{- if .Values.backend.env.S3_ACCESS_KEY_ID }}
  S3_ACCESS_KEY_ID: {{ .Values.backend.env.S3_ACCESS_KEY_ID | quote }}
  {{- end }}
  {{- if .Values.backend.env.METRICS_TOKEN }}
  METRICS_TOKEN: {{ .Values.backend.env.METRICS_TOKEN | quote }}
  {{- end }}
