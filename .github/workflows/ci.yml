name: CI

# Lighter, non-publishing suite. Runs on every pull request and on pushes to
# any branch EXCEPT main. Pushes to main and version tags are handled by
# docker-publish.yml, which runs its own gating tests before building images —
# keeping these triggers mutually exclusive avoids double-running the suite.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Real Postgres for the BKT_TEST_POSTGRES_*-gated integration tests
    # (skipped when those env vars are unset, e.g. on a laptop).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BKT_TEST_POSTGRES_HOST: localhost
      BKT_TEST_POSTGRES_PASSWORD: postgres
      # Dedicated database for the DSN-based key-rotation test (it DROPs and
      # recreates tables); HOST-based tests create throwaway databases of
      # their own (internal/database/pgtest).
      BKT_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=bkt_rotation_test sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Create integration test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -U postgres -c 'CREATE DATABASE bkt_rotation_test'

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test (race + cover)
        working-directory: backend
        # Packages run in parallel: each Postgres-gated test works in its own
        # throwaway database (internal/database/pgtest).
        run: go test ./... -race -cover

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: backend

  backend-vuln:
    name: Backend Vulnerability Scan
    runs-on: ubuntu-latest
    # Non-blocking: a freshly published advisory shouldn't wedge development,
    # but the finding stays visible in the checks list.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
