{{- /*
Mirror the backend's secret rules at render time so a bad value fails the
install instead of crash-looping the pod.
  JWT_SECRET:     >= 32 chars, no <placeholder>, not the public dev default.
  ENCRYPTION_KEY: not a placeholder (<...>, generated_by_setup, change_me,
                  change_in_production, replace_me) and not the public dev
                  default. A SHORT existing key is NOT rejected (the backend
                  only warns): it already encrypts stored credentials, and
                  changing it outright would strand them. Rotate it with
                  ENCRYPTION_KEY_PREVIOUS instead.
ENCRYPTION_KEY_PREVIOUS / ENCRYPTION_LEGACY_JWT_SECRET are decrypt-only and
exempt from every check.
*/ -}}
{{- $devDefault := "dev_jwt_secret_change_in_production" }}
{{- $jwt := .Values.backend.env.JWT_SECRET | default "" | toString }}
{{- if and $jwt (or (lt (len $jwt) 32) (contains "<" $jwt) (contains ">" $jwt) (eq $jwt $devDefault)) }}
{{- fail "backend.env.JWT_SECRET must be at least 32 characters, not a placeholder and not the public development default (generate one with: openssl rand -hex 32)" }}
{{- end }}
{{- $ek := .Values.backend.env.ENCRYPTION_KEY | default "" | toString }}
{{- if $ek }}
{{- $ekTrim := trim $ek }}
{{- $ekNorm := $ekTrim | lower | replace "-" "" | replace "_" "" | replace "." "" | replace " " "" }}
{{- if or (eq $ek $devDefault) (and (hasPrefix "<" $ekTrim) (hasSuffix ">" $ekTrim)) (contains "generatedbysetup" $ekNorm) (contains "changeme" $ekNorm) (contains "changeinproduction" $ekNorm) (contains "replaceme" $ekNorm) (contains "yourencryptionkey" $ekNorm) }}
{{- fail "backend.env.ENCRYPTION_KEY is a placeholder or the public development default (generate one with: openssl rand -hex 32; to rotate an existing key put the old value in backend.env.ENCRYPTION_KEY_PREVIOUS)" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bkt.fullname" . }}-backend
  labels:
    {{- include "bkt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET: {{ required "backend.env.JWT_SECRET is required" .Values.backend.env.JWT_SECRET | quote }}
  ENCRYPTION_KEY: {{ required "backend.env.ENCRYPTION_KEY is required" .Values.backend.env.ENCRYPTION_KEY | quote }}
  ADMIN_PASSWORD: {{ required "backend.env.ADMIN_PASSWORD is required" .Values.backend.env.ADMIN_PASSWORD | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}
  {{- else }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if .Values.backend.env.OIDC_CLIENT_SECRET }}
  OIDC_CLIENT_SECRET: {{ .Values.backend.env.OIDC_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.backend.env.GOOGLE_CLIENT_SECRET }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.env.GOOGLE_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.backend.env.S3_SECRET_ACCESS_KEY }}
  S3_SECRET_ACCESS_KEY: {{ .Values.backend.env.S3_SECRET_ACCESS_KEY | quote }}
  {{- end }}
  {{- if .Values.backend.env.S3_ACCESS_KEY_ID }}
  S3_ACCESS_KEY_ID: {{ .Values.backend.env.S3_ACCESS_KEY_ID | quote }}
  {{- end }}
  {{- if .Values.backend.env.METRICS_TOKEN }}
  METRICS_TOKEN: {{ .Values.backend.env.METRICS_TOKEN | quote }}
  {{- end }}
  {{- /* Decrypt-only keys (rotation/migration): no strength checks by design. */}}
  {{- if .Values.backend.env.ENCRYPTION_KEY_PREVIOUS }}
  ENCRYPTION_KEY_PREVIOUS: {{ .Values.backend.env.ENCRYPTION_KEY_PREVIOUS | toString | quote }}
  {{- end }}
  {{- if .Values.backend.env.ENCRYPTION_LEGACY_JWT_SECRET }}
  ENCRYPTION_LEGACY_JWT_SECRET: {{ .Values.backend.env.ENCRYPTION_LEGACY_JWT_SECRET | toString | quote }}
  {{- end }}
