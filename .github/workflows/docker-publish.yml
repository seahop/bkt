name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Least privilege by default; the image builds grant themselves packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/seahop/bkt-backend
  OMNIBUS_IMAGE: ghcr.io/seahop/bkt

jobs:
  # ── Gates ──────────────────────────────────────────────────────────────────
  # These run first; the image builds `needs:` them, so a failing test or a
  # frontend lint/type error blocks the publish. (Pull requests run the same
  # checks plus golangci-lint/govulncheck via ci.yml; this workflow only fires
  # on main + tags.)
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Real Postgres for the BKT_TEST_POSTGRES_*-gated integration tests
    # (same setup as ci.yml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BKT_TEST_POSTGRES_HOST: localhost
      BKT_TEST_POSTGRES_PASSWORD: postgres
      # Dedicated database for the DSN-based key-rotation test (it DROPs and
      # recreates tables); HOST-based tests create throwaway databases of
      # their own (internal/database/pgtest).
      BKT_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=bkt_rotation_test sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Create integration test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -U postgres -c 'CREATE DATABASE bkt_rotation_test'

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test (race + cover)
        working-directory: backend
        # Packages run in parallel: each Postgres-gated test works in its own
        # throwaway database (internal/database/pgtest).
        run: go test ./... -race -cover

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # UI-inclusive backend (no DB) — used by the Helm chart / docker-compose.prod
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=bkt Backend
            org.opencontainers.image.description=bkt object storage gateway — API server + web UI
            org.opencontainers.image.vendor=bkt
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/seahop/bkt

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Root context so the frontend can be built and embedded.
          context: .
          file: ./Dockerfile
          target: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # Keep the published image a plain multi-arch manifest (build-push v7
          # defaults provenance on, which adds attestation manifests). Set to
          # "mode=max" later if you want supply-chain attestations.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Single-container omnibus (backend + UI + bundled Postgres) — easy self-host
  build-omnibus:
    name: Build Omnibus Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for omnibus image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.OMNIBUS_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=bkt
            org.opencontainers.image.description=bkt object storage gateway — single-container (UI + API + Postgres)
            org.opencontainers.image.vendor=bkt
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/seahop/bkt

      - name: Build and push omnibus image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: omnibus
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # Keep the published image a plain multi-arch manifest (build-push v7
          # defaults provenance on, which adds attestation manifests). Set to
          # "mode=max" later if you want supply-chain attestations.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=omnibus
          cache-to: type=gha,mode=max,scope=omnibus

  # Vulnerability scan of the published backend image. Non-blocking for now
  # (exit-code 0 / continue-on-error) so a new CVE doesn't wedge releases —
  # findings stay visible in the job log. Flip exit-code to '1' to enforce.
  image-scan:
    name: Scan Backend Image (Trivy)
    runs-on: ubuntu-latest
    needs: build-backend
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scan by digest so the exact image just built/pushed is analysed,
          # regardless of which tags (latest / semver / sha) were applied.
          image-ref: ${{ env.BACKEND_IMAGE }}@${{ needs.build-backend.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # Summary job that requires both builds to pass — useful for branch protection rules
  images-published:
    name: Images Published
    runs-on: ubuntu-latest
    needs: [build-backend, build-omnibus]
    if: github.event_name != 'pull_request'
    steps:
      - name: Summary
        run: |
          {
            echo "## Images Published"
            echo ""
            echo "| Image | Registry |"
            echo "|-------|----------|"
            echo "| Omnibus (1 container) | \`ghcr.io/seahop/bkt\` |"
            echo "| Backend (UI + API)    | \`ghcr.io/seahop/bkt-backend\` |"
            echo ""
            echo "Quickstart: \`docker run -d -p 9000:9000 -p 9443:9443 -v bkt:/data ghcr.io/seahop/bkt\`"
          } >> "$GITHUB_STEP_SUMMARY"
