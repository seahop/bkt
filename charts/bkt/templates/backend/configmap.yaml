apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bkt.fullname" . }}-backend
  labels:
    {{- include "bkt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  DB_HOST: {{ include "bkt.databaseHost" . | quote }}
  DB_PORT: {{ include "bkt.databasePort" . | quote }}
  DB_NAME: {{ include "bkt.databaseName" . | quote }}
  DB_USER: {{ include "bkt.databaseUser" . | quote }}
  {{- /* In-chart Postgres has no TLS configured (cluster-internal traffic). */}}
  DB_SSL_MODE: {{ if .Values.postgresql.enabled }}"disable"{{ else }}{{ .Values.externalDatabase.sslMode | default "require" | quote }}{{ end }}
  SERVER_PORT: "9000"
  GO_ENV: {{ .Values.backend.env.GO_ENV | default "production" | quote }}
  TLS_ENABLED: {{ .Values.backend.tls.enabled | toString | quote }}
  TLS_TERMINATED_UPSTREAM: {{ .Values.backend.tls.terminatedUpstream | default false | toString | quote }}
  ADMIN_USERNAME: {{ .Values.backend.env.ADMIN_USERNAME | default "admin" | quote }}
  ADMIN_EMAIL: {{ .Values.backend.env.ADMIN_EMAIL | default "admin@localhost" | quote }}
  ALLOW_REGISTRATION: {{ .Values.backend.env.ALLOW_REGISTRATION | default "false" | quote }}
  STORAGE_BACKEND: {{ .Values.backend.env.STORAGE_BACKEND | default "local" | quote }}
  STORAGE_ROOT: "/data/buckets"
  S3_ENABLED: {{ .Values.backend.env.S3_ENABLED | default "false" | quote }}
  S3_ENDPOINT: {{ .Values.backend.env.S3_ENDPOINT | default "" | quote }}
  S3_REGION: {{ .Values.backend.env.S3_REGION | default "us-east-1" | quote }}
  S3_BUCKET_PREFIX: {{ .Values.backend.env.S3_BUCKET_PREFIX | default "" | quote }}
  S3_USE_SSL: {{ .Values.backend.env.S3_USE_SSL | default "true" | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.backend.env.S3_FORCE_PATH_STYLE | default "false" | quote }}
  S3_SSE: {{ .Values.backend.env.S3_SSE | default "false" | quote }}
  S3_BUCKETS: {{ .Values.backend.env.S3_BUCKETS | default "" | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.backend.env.S3_PUBLIC_ENDPOINT | default "" | quote }}
  AUTH_RATE_LIMIT: {{ .Values.backend.env.AUTH_RATE_LIMIT | default "20" | quote }}
  AUTH_REFRESH_RATE_LIMIT: {{ .Values.backend.env.AUTH_REFRESH_RATE_LIMIT | default "30" | quote }}
  ACCESS_TOKEN_EXPIRY: {{ include "bkt.env" (list . "ACCESS_TOKEN_EXPIRY" "15m") | quote }}
  REFRESH_TOKEN_EXPIRY: {{ include "bkt.env" (list . "REFRESH_TOKEN_EXPIRY" "168h") | quote }}
  SWAGGER_ENABLED: {{ .Values.backend.env.SWAGGER_ENABLED | default "" | quote }}
  HSTS_MAX_AGE: {{ include "bkt.env" (list . "HSTS_MAX_AGE" "31536000") | quote }}
  CONTENT_TYPE_ENFORCEMENT: {{ .Values.backend.env.CONTENT_TYPE_ENFORCEMENT | default "false" | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | default "" | quote }}
  CORS_ALLOW_CREDENTIALS: {{ include "bkt.env" (list . "CORS_ALLOW_CREDENTIALS" "true") | quote }}
  TRUSTED_PROXIES: {{ include "bkt.trustedProxies" . | quote }}
  S3_RATE_LIMIT: {{ .Values.backend.env.S3_RATE_LIMIT | default "0" | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.backend.env.AUDIT_RETENTION_DAYS | default "90" | quote }}
  WEBHOOK_ALLOWED_HOSTS: {{ .Values.backend.env.WEBHOOK_ALLOWED_HOSTS | default "" | quote }}
  ENCRYPTION_REENCRYPT_ON_STARTUP: {{ .Values.backend.env.ENCRYPTION_REENCRYPT_ON_STARTUP | default "" | toString | quote }}
  OIDC_ENABLED: {{ .Values.backend.env.OIDC_ENABLED | default "" | quote }}
  OIDC_ISSUER_URL: {{ .Values.backend.env.OIDC_ISSUER_URL | default "" | quote }}
  OIDC_CLIENT_ID: {{ .Values.backend.env.OIDC_CLIENT_ID | default "" | quote }}
  OIDC_REDIRECT_URL: {{ .Values.backend.env.OIDC_REDIRECT_URL | default "" | quote }}
  OIDC_SCOPES: {{ .Values.backend.env.OIDC_SCOPES | default "openid profile email" | quote }}
  OIDC_PROVIDER_NAME: {{ .Values.backend.env.OIDC_PROVIDER_NAME | default "SSO" | quote }}
  OIDC_USERNAME_CLAIM: {{ .Values.backend.env.OIDC_USERNAME_CLAIM | default "" | quote }}
  OIDC_GROUPS_CLAIM: {{ .Values.backend.env.OIDC_GROUPS_CLAIM | default "groups" | quote }}
  OIDC_ADMIN_GROUP: {{ .Values.backend.env.OIDC_ADMIN_GROUP | default "" | quote }}
  OIDC_USER_GROUP: {{ .Values.backend.env.OIDC_USER_GROUP | default "" | quote }}
  OIDC_POLICIES_CLAIM: {{ .Values.backend.env.OIDC_POLICIES_CLAIM | default "" | quote }}
  OIDC_LINK_BY_EMAIL: {{ .Values.backend.env.OIDC_LINK_BY_EMAIL | default "false" | quote }}
  OIDC_POLICIES_AUTHORITATIVE: {{ .Values.backend.env.OIDC_POLICIES_AUTHORITATIVE | default "" | quote }}
  OIDC_EXPECTED_ISSUER: {{ .Values.backend.env.OIDC_EXPECTED_ISSUER | default "" | quote }}
  GOOGLE_OIDC_ENABLED: {{ .Values.backend.env.GOOGLE_OIDC_ENABLED | default "false" | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.backend.env.GOOGLE_CLIENT_ID | default "" | quote }}
  GOOGLE_REDIRECT_URL: {{ .Values.backend.env.GOOGLE_REDIRECT_URL | default "" | quote }}
  GOOGLE_ALLOWED_DOMAINS: {{ .Values.backend.env.GOOGLE_ALLOWED_DOMAINS | default "" | quote }}
  GOOGLE_WORKSPACE_ENABLED: {{ include "bkt.env" (list . "GOOGLE_WORKSPACE_ENABLED" "false") | quote }}
  GOOGLE_SERVICE_ACCOUNT_KEY_FILE: {{ include "bkt.env" (list . "GOOGLE_SERVICE_ACCOUNT_KEY_FILE" "") | quote }}
  GOOGLE_WORKSPACE_ADMIN_EMAIL: {{ include "bkt.env" (list . "GOOGLE_WORKSPACE_ADMIN_EMAIL" "") | quote }}
  GOOGLE_POLICY_SYNC_MODE: {{ include "bkt.env" (list . "GOOGLE_POLICY_SYNC_MODE" "direct") | quote }}
  GOOGLE_POLICY_GROUP_PREFIX: {{ include "bkt.env" (list . "GOOGLE_POLICY_GROUP_PREFIX" "") | quote }}
  VAULT_ADDR: {{ .Values.backend.env.VAULT_ADDR | default "" | quote }}
  VAULT_OIDC_ENABLED: {{ .Values.backend.env.VAULT_OIDC_ENABLED | default "false" | quote }}
  VAULT_OIDC_CLIENT_ID: {{ .Values.backend.env.VAULT_OIDC_CLIENT_ID | default "" | quote }}
  VAULT_OIDC_PROVIDER_URL: {{ .Values.backend.env.VAULT_OIDC_PROVIDER_URL | default "" | quote }}
  VAULT_OIDC_REDIRECT_URL: {{ .Values.backend.env.VAULT_OIDC_REDIRECT_URL | default "" | quote }}
  VAULT_OIDC_SCOPES: {{ .Values.backend.env.VAULT_OIDC_SCOPES | default "openid profile" | quote }}
  VAULT_OIDC_EXPECTED_ISSUER: {{ .Values.backend.env.VAULT_OIDC_EXPECTED_ISSUER | default "" | quote }}
  VAULT_POLICIES_AUTHORITATIVE: {{ .Values.backend.env.VAULT_POLICIES_AUTHORITATIVE | default "" | toString | quote }}
  VAULT_SSO_ENABLED: {{ .Values.backend.env.VAULT_SSO_ENABLED | default "false" | quote }}
  VAULT_JWT_AUDIENCE: {{ .Values.backend.env.VAULT_JWT_AUDIENCE | default "" | quote }}
  VAULT_JWT_ISSUER: {{ .Values.backend.env.VAULT_JWT_ISSUER | default "" | quote }}
  VAULT_JWT_PATH: {{ include "bkt.env" (list . "VAULT_JWT_PATH" "auth/jwt") | quote }}
  VAULT_JWT_ROLE: {{ include "bkt.env" (list . "VAULT_JWT_ROLE" "object-storage-users") | quote }}
  FRONTEND_URL: {{ .Values.backend.env.FRONTEND_URL | default "" | quote }}
{{- if and (not .Values.backend.tls.enabled) (not .Values.backend.tls.terminatedUpstream) (has (lower (.Values.backend.env.GO_ENV | default "production")) (list "production" "prod")) }}
{{- fail "backend.tls.enabled=false in production: the backend refuses to serve plain HTTP. If an ingress/reverse proxy terminates TLS in front of bkt, also set backend.tls.terminatedUpstream=true; otherwise keep backend.tls.enabled=true." }}
{{- end }}
