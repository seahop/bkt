{{- /*
Guard: the local storage backend keeps object bytes on the PVC, which is
mounted ReadWriteOnce by default. More than one replica would need every pod
on the same filesystem — silently corrupting writes otherwise. Scale-out is
supported with STORAGE_BACKEND=s3 (stateless pods) or an RWX storage class.
*/ -}}
{{- if and (gt (int .Values.backend.replicaCount) 1) (eq (.Values.backend.env.STORAGE_BACKEND | default "local") "local") (ne .Values.backend.persistence.accessMode "ReadWriteMany") }}
{{- fail "backend.replicaCount > 1 with STORAGE_BACKEND=local requires backend.persistence.accessMode=ReadWriteMany (shared filesystem). Use the s3 storage backend for stateless scale-out, or set replicaCount=1." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bkt.fullname" . }}-backend
  labels:
    {{- include "bkt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "bkt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "bkt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Roll pods automatically when configuration or secrets change.
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ include "bkt.backendTag" . }}"
          imagePullPolicy: {{ include "bkt.backendPullPolicy" . }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: console
              containerPort: 9443
              protocol: TCP
            - name: s3
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bkt.fullname" . }}-backend
            - secretRef:
                name: {{ include "bkt.fullname" . }}-backend
          {{- if .Values.backend.tls.enabled }}
          env:
            - name: TLS_CERT_FILE
              value: /certs/tls.crt
            - name: TLS_KEY_FILE
              value: /certs/tls.key
          {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: 9443
              scheme: {{ if .Values.backend.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 9443
              scheme: {{ if .Values.backend.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: bucket-data
              mountPath: /data/buckets
            {{- if .Values.backend.tls.enabled }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: bucket-data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bkt.fullname" . }}-bucket-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.backend.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.backend.tls.existingSecret | default (printf "%s-tls" (include "bkt.fullname" .)) }}
        {{- end }}
