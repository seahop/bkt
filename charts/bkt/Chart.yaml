apiVersion: v2
name: bkt
description: Self-hosted S3-compatible object storage gateway
type: application
version: 0.1.0
appVersion: "latest"
home: https://bkt.tips
sources:
  - https://github.com/bkt-storage/bkt
keywords:
  - object-storage
  - s3
  - minio-alternative
  - self-hosted
maintainers:
  - name: bkt-storage
    url: https://bkt.tips

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
