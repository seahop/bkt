# Production compose file — uses pre-built images from ghcr.io/seahop
#
# Usage:
#   BKT_VERSION=1.2.0 docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d   # uses :latest
#
# Before first run, make sure you have:
#   1. Generated certs/  via setup.py
#   2. Set required env vars in .env (DB_PASSWORD, JWT_SECRET, ENCRYPTION_KEY, ADMIN_PASSWORD)

services:
  postgres:
    image: postgres:16-alpine
    container_name: bkt-db
    entrypoint: ["/bin/bash", "/postgres-init-ssl.sh"]
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c ssl_ca_file=/var/lib/postgresql/certs/ca.crt
    environment:
      POSTGRES_USER: objectstore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: objectstore
      # Explicit classic layout (the postgres:16 default). Keeps this mount working
      # if the image is later bumped to 18+, whose default PGDATA moved to
      # /var/lib/postgresql/<major>/docker (a major bump still needs pg_upgrade).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init-ssl.sh:/postgres-init-ssl.sh:ro
      - ./certs/postgres:/ssl-certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bkt-network
    restart: unless-stopped

  # One-shot, runs before the backend on every `up`. The backend image runs as
  # the unprivileged uid/gid 10001, so:
  #   - bucket data written by older releases (which ran as root) is re-owned
  #     when ANY entry (not just the top directory) is not 10001:10001; when
  #     everything is already owned it is a read-only metadata walk (no
  #     writes), and a mismatch stops the scan at the first hit, and
  #   - the TLS cert/key from setup.py (key is 0600, owned by the host user) is
  #     copied into a volume readable only by uid 10001.
  init-perms:
    image: ghcr.io/seahop/bkt-backend:${BKT_VERSION:-latest}
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - |
        if [ -n "$$(find /data/buckets \( ! -user 10001 -o ! -group 10001 \) -print -quit)" ]; then
          chown -R 10001:10001 /data/buckets
        fi
        cp -a /certs-src/. /certs/
        chown -R 10001:10001 /certs
        chmod 0500 /certs
        find /certs -type f -name '*.key' -exec chmod 0400 {} +
    volumes:
      - ./data/buckets:/data/buckets
      - ./certs/backend:/certs-src:ro
      - backend-certs:/certs
    restart: "no"

  backend:
    image: ghcr.io/seahop/bkt-backend:${BKT_VERSION:-latest}
    container_name: bkt-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: objectstore
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: objectstore
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # Required — the backend refuses empty/short/placeholder secrets.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      # Decrypt-only keys for rotation/migration (never used to encrypt, exempt
      # from strength checks). ENCRYPTION_KEY_PREVIOUS: comma-separated retired
      # ENCRYPTION_KEYs. ENCRYPTION_LEGACY_JWT_SECRET: a retired JWT_SECRET that
      # encrypted credentials while no ENCRYPTION_KEY was set. Stored credentials
      # are re-encrypted under ENCRYPTION_KEY at startup
      # (ENCRYPTION_REENCRYPT_ON_STARTUP, default true); drop these once the
      # startup log says nothing needs them. setup.py fills them in when it
      # replaces a placeholder/default/short secret.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_LEGACY_JWT_SECRET: ${ENCRYPTION_LEGACY_JWT_SECRET:-}
      ENCRYPTION_REENCRYPT_ON_STARTUP: ${ENCRYPTION_REENCRYPT_ON_STARTUP:-}
      SERVER_PORT: 9000
      GO_ENV: production
      # TLS Configuration
      TLS_ENABLED: "true"
      TLS_CERT_FILE: /certs/backend.crt
      TLS_KEY_FILE: /certs/backend.key
      TLS_CA_FILE: /certs/ca.crt
      # Admin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-}
      # JWT lifetimes (Go durations, e.g. 15m, 168h).
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-168h}
      # Swagger UI at /api/docs is off in production unless set to "true".
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-}
      # Strict-Transport-Security max-age (seconds); 0 disables.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      # Comma-separated proxy CIDRs/IPs whose X-Forwarded-For is trusted for
      # rate limiting; empty (default) = trust none.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Per-IP requests/minute on the S3 listener; empty or 0 = disabled.
      S3_RATE_LIMIT: ${S3_RATE_LIMIT:-}
      # Days to keep audit log rows (backend default 90; <= 0 disables pruning).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      # When set, GET /metrics requires "Authorization: Bearer <token>".
      # Strongly recommended in production (a warning is logged when unset).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Comma-separated hostnames/IPs/CIDRs webhook deliveries may reach even
      # though they are private/loopback (SSRF guard); empty = public only.
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      # Explicit http(s) egress proxy for webhook deliveries (may carry
      # user:pass); empty = connect directly. HTTP(S)_PROXY is never used.
      WEBHOOK_PROXY_URL: ${WEBHOOK_PROXY_URL:-}
      # Base URL embedded in console-generated presigned URLs (empty = derive
      # from the request host + S3 API port, correct when clients reach the
      # backend directly; set it when running behind a proxy/LB).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # SSE-S3 pass-through for the external S3 backend
      S3_SSE: ${S3_SSE:-false}
      # CORS — set to your actual frontend domain in production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      # Generic OIDC (any OpenID Connect IdP; authorization code + PKCE)
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_USER_GROUP: ${OIDC_USER_GROUP:-}
      OIDC_POLICIES_CLAIM: ${OIDC_POLICIES_CLAIM:-}  # empty = backend default "policies" (non-authoritative)
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # Empty = backend default (authoritative when OIDC_POLICIES_CLAIM is set)
      OIDC_POLICIES_AUTHORITATIVE: ${OIDC_POLICIES_AUTHORITATIVE:-}
      # Issuer the discovery doc / ID tokens carry when it legitimately differs
      # from OIDC_ISSUER_URL (IdP reached via an internal hostname); empty = same.
      OIDC_EXPECTED_ISSUER: ${OIDC_EXPECTED_ISSUER:-}
      # Google OIDC
      GOOGLE_OIDC_ENABLED: ${GOOGLE_OIDC_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_WORKSPACE_ENABLED: ${GOOGLE_WORKSPACE_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:-}
      GOOGLE_WORKSPACE_ADMIN_EMAIL: ${GOOGLE_WORKSPACE_ADMIN_EMAIL:-}
      GOOGLE_POLICY_SYNC_MODE: ${GOOGLE_POLICY_SYNC_MODE:-direct}
      GOOGLE_POLICY_GROUP_PREFIX: ${GOOGLE_POLICY_GROUP_PREFIX:-}
      # Vault OIDC
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_OIDC_ENABLED: ${VAULT_OIDC_ENABLED:-false}
      # Legacy Vault JWT login (POST /api/auth/vault/login)
      VAULT_SSO_ENABLED: ${VAULT_SSO_ENABLED:-false}
      VAULT_JWT_AUDIENCE: ${VAULT_JWT_AUDIENCE:-}
      VAULT_JWT_ISSUER: ${VAULT_JWT_ISSUER:-}
      # Vault JWT auth mount (JWKS: <VAULT_ADDR>/v1/<path>/.well-known/jwks.json)
      VAULT_JWT_PATH: ${VAULT_JWT_PATH:-auth/jwt}
      VAULT_JWT_ROLE: ${VAULT_JWT_ROLE:-object-storage-users}
      VAULT_OIDC_CLIENT_ID: ${VAULT_OIDC_CLIENT_ID:-}
      VAULT_OIDC_PROVIDER_URL: ${VAULT_OIDC_PROVIDER_URL:-}
      VAULT_OIDC_REDIRECT_URL: ${VAULT_OIDC_REDIRECT_URL:-}
      VAULT_OIDC_SCOPES: ${VAULT_OIDC_SCOPES:-openid profile}
      # Issuer Vault advertises when it differs from VAULT_OIDC_PROVIDER_URL
      # (Vault's api_addr != the URL bkt uses); empty = same.
      VAULT_OIDC_EXPECTED_ISSUER: ${VAULT_OIDC_EXPECTED_ISSUER:-}
      # true = a Vault "policies" claim always replaces the user's bkt policies
      # (empty/unmatched claim removes all). Empty/false = only when a claimed
      # name matches an existing bkt policy.
      VAULT_POLICIES_AUTHORITATIVE: ${VAULT_POLICIES_AUTHORITATIVE:-}
      # Where SSO flows land after login: the console origin users browse to.
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:9443}
      # Storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: /data/buckets
      # Detect content types from magic bytes and reject unsafe ones.
      CONTENT_TYPE_ENFORCEMENT: ${CONTENT_TYPE_ENFORCEMENT:-false}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_BUCKETS: ${S3_BUCKETS:-}
    ports:
      - "9443:9443"  # console: web UI + REST API (the backend image serves the UI)
      - "9000:9000"  # S3-compatible API (aws-cli / s3fs)
    volumes:
      - ./data/buckets:/data/buckets
      - backend-certs:/certs:ro   # populated from ./certs/backend by init-perms
    depends_on:
      postgres:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:9443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bkt-network
    restart: unless-stopped

# The web UI is now embedded in the backend image and served on the console
# port (9443) — there is no separate frontend container.

networks:
  bkt-network:
    driver: bridge

volumes:
  backend-certs:
