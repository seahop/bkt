services:
  postgres:
    # Tracks the Postgres major bundled in the omnibus image. An existing dev
    # volume from postgres:16 is not readable by 18: `docker compose down -v`.
    image: postgres:18-alpine
    container_name: bkt-db
    entrypoint: ["/bin/bash", "/postgres-init-ssl.sh"]
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c ssl_ca_file=/var/lib/postgresql/certs/ca.crt
    environment:
      POSTGRES_USER: objectstore
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Generated by setup.py
      POSTGRES_DB: objectstore
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker and refuses
      # to start when a volume is mounted at the old path; pin the old layout.
      PGDATA: /var/lib/postgresql/data
    # Database is only accessible within Docker network (not exposed to host)
    # Use: docker exec -it bkt-db psql -U objectstore -d objectstore
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init-ssl.sh:/postgres-init-ssl.sh:ro
      - ./certs/postgres:/ssl-certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bkt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: bkt-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: objectstore
      DB_PASSWORD: ${DB_PASSWORD}  # Generated by setup.py
      DB_NAME: objectstore
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      # Secrets — generated by setup.py. There is deliberately NO fallback for
      # JWT_SECRET: a publicly known default would let anyone forge tokens, and
      # the backend refuses empty/short/placeholder secrets in every GO_ENV.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (run python3 setup.py)}
      # Encrypts stored S3 credentials. When empty, development falls back to a
      # JWT_SECRET-derived key (with a warning); data written that way stays
      # readable after ENCRYPTION_KEY is set. Production requires it.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Decrypt-only keys for rotation/migration (never used to encrypt, exempt
      # from strength checks). ENCRYPTION_KEY_PREVIOUS: comma-separated retired
      # ENCRYPTION_KEYs. ENCRYPTION_LEGACY_JWT_SECRET: a retired JWT_SECRET that
      # encrypted credentials while no ENCRYPTION_KEY was set. Stored credentials
      # are re-encrypted under ENCRYPTION_KEY at startup
      # (ENCRYPTION_REENCRYPT_ON_STARTUP, default true); drop these once the
      # startup log says nothing needs them. setup.py fills them in when it
      # replaces a placeholder/default/short secret.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ENCRYPTION_LEGACY_JWT_SECRET: ${ENCRYPTION_LEGACY_JWT_SECRET:-}
      ENCRYPTION_REENCRYPT_ON_STARTUP: ${ENCRYPTION_REENCRYPT_ON_STARTUP:-}
      GO_ENV: ${GO_ENV:-development}
      SERVER_PORT: ${SERVER_PORT:-9000}
      # TLS Configuration (paths are inside the container; certs from setup.py)
      TLS_ENABLED: ${TLS_ENABLED:-true}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/backend.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/backend.key}
      TLS_CA_FILE: ${TLS_CA_FILE:-/certs/ca.crt}
      # Admin Configuration (from .env file)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-60}
      # Separate per-IP budget for /api/auth/refresh (backend default 30/min).
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-}
      # Swagger UI at /api/docs (default: on in development, off in production).
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-}
      # Comma-separated proxy CIDRs/IPs whose X-Forwarded-For is trusted for
      # rate limiting; empty (default) = trust none.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Per-IP requests/minute on the S3 listener; empty or 0 = disabled.
      S3_RATE_LIMIT: ${S3_RATE_LIMIT:-}
      # Days to keep audit log rows (backend default 90; <= 0 disables pruning).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      # When set, GET /metrics requires "Authorization: Bearer <token>".
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Comma-separated hostnames/IPs/CIDRs webhook deliveries may reach even
      # though they are private/loopback (SSRF guard); empty = public only.
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      # Base URL embedded in console-generated presigned URLs. The dev stack
      # fronts the backend with the vite proxy, so host derivation would see the
      # internal service name — pin the browser-facing S3 endpoint instead.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://localhost:9000}
      # SSE-S3 pass-through for the external S3 backend
      S3_SSE: ${S3_SSE:-false}
      # CORS: when unset, the backend falls back to its built-in localhost dev origins.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      # Generic OIDC (any OpenID Connect IdP; authorization code + PKCE)
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-https://localhost:9443/api/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_USER_GROUP: ${OIDC_USER_GROUP:-}
      OIDC_POLICIES_CLAIM: ${OIDC_POLICIES_CLAIM:-}  # empty = backend default "policies" (non-authoritative)
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # Empty = backend default (authoritative when OIDC_POLICIES_CLAIM is set)
      OIDC_POLICIES_AUTHORITATIVE: ${OIDC_POLICIES_AUTHORITATIVE:-}
      # Issuer the discovery doc / ID tokens carry when it legitimately differs
      # from OIDC_ISSUER_URL (IdP reached via an internal hostname); empty = same.
      OIDC_EXPECTED_ISSUER: ${OIDC_EXPECTED_ISSUER:-}
      # Google OIDC Configuration (browser-based SSO)
      GOOGLE_OIDC_ENABLED: ${GOOGLE_OIDC_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://localhost:9443/api/auth/google/callback}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_WORKSPACE_ENABLED: ${GOOGLE_WORKSPACE_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:-}
      GOOGLE_WORKSPACE_ADMIN_EMAIL: ${GOOGLE_WORKSPACE_ADMIN_EMAIL:-}
      GOOGLE_POLICY_SYNC_MODE: ${GOOGLE_POLICY_SYNC_MODE:-direct}
      GOOGLE_POLICY_GROUP_PREFIX: ${GOOGLE_POLICY_GROUP_PREFIX:-}
      # Vault OIDC Configuration (browser-based SSO with PKCE)
      VAULT_ADDR: ${VAULT_ADDR:-https://vault.example.com:8200}
      VAULT_OIDC_ENABLED: ${VAULT_OIDC_ENABLED:-false}
      # Legacy Vault JWT login (POST /api/auth/vault/login)
      VAULT_SSO_ENABLED: ${VAULT_SSO_ENABLED:-false}
      VAULT_JWT_AUDIENCE: ${VAULT_JWT_AUDIENCE:-}
      VAULT_JWT_ISSUER: ${VAULT_JWT_ISSUER:-}
      VAULT_OIDC_CLIENT_ID: ${VAULT_OIDC_CLIENT_ID:-}
      VAULT_OIDC_PROVIDER_URL: ${VAULT_OIDC_PROVIDER_URL:-}
      VAULT_OIDC_REDIRECT_URL: ${VAULT_OIDC_REDIRECT_URL:-https://localhost:9443/api/auth/vault/callback}
      VAULT_OIDC_SCOPES: ${VAULT_OIDC_SCOPES:-openid profile}
      # Issuer Vault advertises when it differs from VAULT_OIDC_PROVIDER_URL
      # (Vault's api_addr != the URL bkt uses); empty = same.
      VAULT_OIDC_EXPECTED_ISSUER: ${VAULT_OIDC_EXPECTED_ISSUER:-}
      # true = a Vault "policies" claim always replaces the user's bkt policies
      # (empty/unmatched claim removes all). Empty/false = only when a claimed
      # name matches an existing bkt policy.
      VAULT_POLICIES_AUTHORITATIVE: ${VAULT_POLICIES_AUTHORITATIVE:-}
      # Where SSO flows land after login. The dev stack serves the UI from the
      # vite dev server (5173); set FRONTEND_URL=https://localhost:9443 if you
      # browse the backend-embedded UI instead. It must be the SAME origin the
      # login was started from (the SSO callback checks a per-tab marker).
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:5173}
      # Storage Configuration
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}  # "local" or "s3"
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/buckets}
      # S3 Storage Configuration (optional, for S3 backend)
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-s3.amazonaws.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}  # Set to true for MinIO
      # Comma-separated S3 buckets to auto-provision (link/create) on startup
      S3_BUCKETS: ${S3_BUCKETS:-}
    ports:
      - "9443:9443"  # console: web UI + REST API
      - "9000:9000"  # S3-compatible API (aws-cli / s3fs)
    volumes:
      - ./data/buckets:/data/buckets
      - ./backend:/app
      - ./certs/backend:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:9443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bkt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: bkt-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://localhost:9443}
      VITE_USE_HTTPS: ${VITE_USE_HTTPS:-true}
    ports:
      - "5173:5173"
      - "8443:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./certs/frontend:/certs:ro
    depends_on:
      - backend
    networks:
      - bkt-network

  # Smoke test runner — only starts when explicitly requested
  # Usage: docker compose run --rm test
  #        docker compose run --rm test --no-cleanup
  test:
    build:
      context: ./tests
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      BKT_ENDPOINT: https://bkt-backend:9443     # console / REST API
      BKT_S3_ENDPOINT: https://bkt-backend:9000  # S3-compatible API
      BKT_USERNAME: ${ADMIN_USERNAME:-admin}
      BKT_PASSWORD: ${ADMIN_PASSWORD}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-}
      # Pre-provisioned bucket(s) the s3 pass links to (IAM may lack CreateBucket)
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      - backend
    networks:
      - bkt-network

networks:
  bkt-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
