{{- /*
Self-signed TLS for the backend listeners when tls.enabled and no
existingSecret was supplied. The `lookup` keeps an already-generated cert
stable across `helm upgrade` (a fresh cert every upgrade would churn client
trust); `helm template` (no cluster) generates a throwaway one.
Production deployments should prefer backend.tls.existingSecret (e.g. from
cert-manager) — this fallback exists so the chart works out of the box.
*/ -}}
{{- if and .Values.backend.tls.enabled (not .Values.backend.tls.existingSecret) }}
{{- $secretName := printf "%s-tls" (include "bkt.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "bkt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: kubernetes.io/tls
{{- if $existing }}
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $altNames := list (printf "%s-backend" (include "bkt.fullname" .)) (printf "%s-backend.%s" (include "bkt.fullname" .) .Release.Namespace) (printf "%s-backend.%s.svc" (include "bkt.fullname" .) .Release.Namespace) "localhost" }}
{{- $cert := genSelfSignedCert (printf "%s-backend" (include "bkt.fullname" .)) (list "127.0.0.1") $altNames 3650 }}
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
